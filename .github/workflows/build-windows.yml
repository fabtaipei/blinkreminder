name: Build Windows exe

# Runs the project's own build.py, which is also what freshness checks are
# measured against locally. CI building the same script a developer runs by
# hand means "it built in CI" and "it built on my machine" are the same
# claim, not two separate things that can quietly drift apart.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: py -m pip install pystray pillow pyinstaller

      - name: Build
        run: py build.py

      - name: Upload exe as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: error

      # Only on a version tag (e.g. v1.1.2), attach the exe to a GitHub
      # Release so store/README download links have something to point at.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
