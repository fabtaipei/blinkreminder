name: Build Windows exe

# Runs the project's own build.py, which is also what freshness checks are
# measured against locally. CI building the same script a developer runs by
# hand means "it built in CI" and "it built on my machine" are the same
# claim, not two separate things that can quietly drift apart.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    # The workflow's own token is read-only by default, and creating a release
    # is a write. Without this the tag build passed every check, built the
    # exe, and then failed at the very last step with 403 "Resource not
    # accessible by integration" -- so no release was ever published.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: py -m pip install pystray pillow pyinstaller

      # Before the build, because it is cheap and because the failure it
      # catches -- a translation that is too wide for the control it goes in
      # -- is invisible in a built exe unless you happen to read that
      # language. Also checks that the manifest advertises exactly the
      # languages the app actually speaks.
      - name: Check translations
        run: py test_i18n.py

      # The day counting behind the coffee/review cards: once a day however
      # often the laptop opens, never twice for a clock moved back, and
      # "Don't ask again" ending every ask. Pure logic, no window needed.
      - name: Check the ask schedule
        run: py test_asks.py

      # The first-run lesson: five taught reminders, then the strength
      # question, its steps staying inside what Settings offers, and a
      # damaged tutorial file costing nothing worse than a second lesson.
      - name: Check the tutorial
        run: py test_tutorial.py

      # When a reminder happens, and how fast it may pulse. The breaks land on
      # a midnight-anchored boundary, one blink timer exists at a time, a
      # reminder that throws still re-arms the next one, a snooze ends -- and
      # no combination of settings can drive a repeating pulse past the
      # photosensitivity floor, which is the one failure here that could hurt
      # somebody rather than merely annoy them.
      - name: Check the timers and the flash ceiling
        run: py test_timing.py

      # Who owns "start with Windows", and what the panel says about it. The
      # states a real machine takes weeks to reach are all reachable with a
      # stand-in winreg, including every way the read can fail -- all of which
      # must answer ON, because the manifest declares the task enabled and the
      # opposite default would tell a user their reminders are off while they
      # are running. Also fails if either label stops being a real key in all
      # 29 languages, which is how a reworded button would quietly start
      # showing English to everybody.
      - name: Check the startup state and its label
        run: py test_startup.py

      # The two windows that only a real window can test: the Startup button
      # as the panel actually builds it, and the crash dialog actually shown.
      # Both are drawn on a desktop the process creates for itself, so they
      # cannot reach anybody's screen -- and the run REFUSES to start if that
      # desktop cannot be made, rather than drawing on the one in use.
      - name: Check the windows that have to be drawn
        run: py test_ui.py

      # The Chrome extension: its rules under Node, then its strings and
      # locales regenerated and compared with what is committed -- so a
      # translation changed in blink_i18n.py cannot leave the extension
      # quietly showing the old one.
      - name: Check the Chrome extension
        working-directory: chrome
        run: node --test

      # bash, not the default PowerShell, which would carry on past a failed
      # build and report only whether the diff was clean.
      - name: Check the Chrome extension's generated files are current
        shell: bash
        run: |
          py chrome/build_extension.py
          git diff --exit-code -- chrome/strings.js chrome/_locales

      # The extension's own smoke test, and the same argument as the exe's:
      # node --test above runs the RULES, on a machine where nothing is
      # packaged and no browser is involved. This loads what actually ships
      # into a real headless Chrome and drives it. The harness has existed
      # since the extension did; nothing ever ran it, which is exactly the
      # shape of gap that let 1.4.2.0 reach the Store.
      #
      # Chrome is resolved rather than assumed: the default path is this
      # author's machine, and a runner that has moved it should say so
      # instead of failing somewhere inside a spawn.
      - name: Smoke test the extension in a real Chrome
        shell: bash
        run: |
          py chrome/build_extension.py --zip
          for c in "/c/Program Files/Google/Chrome/Application/chrome.exe" \
                   "/c/Program Files (x86)/Google/Chrome/Application/chrome.exe"; do
            if [ -f "$c" ]; then CHROME="$c"; break; fi
          done
          if [ -z "$CHROME" ]; then
            echo "no Chrome found on this runner; looked in Program Files"
            exit 1
          fi
          BLINK_EXT_SRC=dist-chrome/unpacked node chrome/e2e/headless.js "$CHROME"

      - name: Build
        run: py build.py

      # The step every check above cannot be: it runs the ARTIFACT, not the
      # source. Each test before this one runs on a machine with the whole of
      # Pillow installed, which is the one environment where a packaging bug
      # cannot appear -- so 1.4.2.0 passed every check here and then died on
      # launch for every user, because its exe was missing a Pillow extension
      # the icon had started needing.
      #
      # It knows nothing about Pillow or exclusions. It starts the exe with a
      # throwaway APPDATA, waits for the app's own "start" line, and fails on
      # a missing line or any logged ERROR. Verified against a deliberately
      # broken build: it exits 1 and prints the ImportError.
      - name: Smoke test the built exe
        run: py smoke_launch.py

      - name: Upload exe as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: error

      # Only on a version tag (e.g. v1.1.2), attach the exe to a GitHub
      # Release so store/README download links have something to point at.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
