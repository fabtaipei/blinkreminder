<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="ui.css">
<title>Dry Eyes Blink Reminder</title>
</head>
<body class="options">
<main>
  <!-- Shown once, on install: what the app does, then the one switch that
       decides how reminders arrive. The privacy line belongs on the switch
       in the settings card below, not here -- a card introducing the app
       should not open by defending it. -->
  <section id="welcome" class="card welcome" hidden>
    <h1 id="welcome-title"></h1>
    <p data-t="A cue appears periodically, to remind you to blink fully: close, squeeze gently, open."></p>
    <div class="callout" id="welcome-grant-box">
      <button id="welcome-grant" class="primary" data-t="Show the cue on web pages"></button>
    </div>
    <div class="buttons">
      <button id="show-me" data-t="Show me"></button>
      <button id="got-it" class="primary" data-t="Got it"></button>
    </div>
  </section>

  <!-- "Too weak or intrusive?" -- shown after the taught reminders, and
       after Show me. Each button takes the eye to the control that changes
       what it names; Got it puts the question away for good. -->
  <section id="question" class="card welcome" hidden>
    <h2 id="question-title"></h2>
    <p class="muted" data-t="You can change these:"></p>
    <div class="buttons" id="question-buttons"></div>
  </section>

  <header class="page-head">
    <img src="icons/icon-48.png" width="32" height="32" alt="">
    <h1>Dry Eyes Blink Reminder</h1>
    <select id="language" aria-label="Language"></select>
  </header>

  <section class="card">
    <label class="row switch">
      <span data-t="Reminders on"></span>
      <input type="checkbox" id="enabled" role="switch">
    </label>
    <label class="row switch">
      <span data-t="Show the cue on web pages"></span>
      <input type="checkbox" id="page-cue" role="switch">
    </label>
    <label class="row switch">
      <span data-t="Show a dot in the corner"></span>
      <input type="checkbox" id="page-dot" role="switch">
    </label>
  </section>

  <div class="columns">
    <section class="card" id="blink-card">
      <h2 id="blink-h" data-t="Blink"></h2>
      <div class="head">
        <div class="row"><span data-t="Remind me every"></span></div>
        <div class="row"><span></span><div id="blink-interval" class="control"></div></div>
      </div>
      <div class="look" data-kind="blink"></div>
    </section>

    <section class="card" id="break-card">
      <h2 id="break-h" data-t="Break"></h2>
      <div class="head">
        <label class="row switch">
          <span data-t="Remind me to look away"></span>
          <input type="checkbox" id="break-enabled" role="switch">
        </label>
        <div class="row"><span></span><div id="break-minutes" class="segmented"></div></div>
      </div>
      <div class="look" data-kind="brk"></div>
    </section>
  </div>

  <footer class="links">
    <a id="coffee" class="support" data-t="Buy me a coffee"></a>
    <a id="rate" data-t="Rate this app"></a>
    <a id="windows" data-t="Full version for Windows" hidden></a>
  </footer>
</main>
<script src="cue.js"></script>
<script type="module" src="options.js"></script>
</body>
</html>
