<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
<title>Dry Eyes Blink Reminder</title>
</head>
<body class="popup">
  <header class="brand">
    <img src="icons/icon-32.png" width="20" height="20" alt="">
    <span>Dry Eyes Blink Reminder</span>
  </header>

  <!-- The waiting ask, if there is one. It sits above everything because it
       is the one thing here that is asking rather than telling. -->
  <section id="ask" class="callout ask" hidden>
    <strong id="ask-title"></strong>
    <p id="ask-message" class="muted"></p>
    <button id="ask-do" class="primary"></button>
    <div class="ask-links">
      <a id="ask-later" data-t="Got it"></a>
      <a id="ask-never" data-t="Don’t ask again"></a>
    </div>
  </section>

  <label class="row switch">
    <span data-t="Reminders on"></span>
    <input type="checkbox" id="enabled" role="switch">
  </label>

  <button id="blink-now" class="primary" data-t="Blink now"></button>

  <div class="row">
    <span data-t="Remind me every"></span>
    <div id="interval" class="control"></div>
  </div>

  <div class="row" id="break-row">
    <span data-t="Break"></span>
    <span id="countdown" class="mono"></span>
  </div>

  <button id="snooze"></button>

  <section id="page-cue" class="callout" hidden>
    <button id="grant" data-t="Show the cue on web pages"></button>
    <p class="muted" data-t="Blink reminders need access to web pages."></p>
  </section>

  <footer>
    <a id="settings" data-t="Settings"></a>
    <a id="howto" data-t="How it works"></a>
    <a id="coffee" class="support" data-t="Buy me a coffee"></a>
    <a id="rate" data-t="Rate this app"></a>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
